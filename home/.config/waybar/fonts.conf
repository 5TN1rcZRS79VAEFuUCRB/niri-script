<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- For waybar only (FONTCONFIG_FILE in ~/.config/niri/config.kdl): the bar's icons come from the
     proportional Nerd Font symbols, which keep their full width, instead of the Mono ones, which
     spill into the space after them. The terminal and menus keep the Mono ones, all one cell wide,
     so menu columns line up. -->
<fontconfig>
	<include ignore_missing="no">/etc/fonts/fonts.conf</include>
	<alias binding="strong">
		<family>monospace</family>
		<prefer>
			<family>DejaVu Sans Mono</family>
			<family>Symbols Nerd Font</family>
		</prefer>
	</alias>
</fontconfig>
